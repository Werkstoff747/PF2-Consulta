<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingmaker — Compendio de Pathfinder 2e</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./icons/Pfav.png">

    <!-- Google Fonts: Cinzel para títulos y Lora para textos -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Librería PapaParse para leer datos del CSV de Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        /* Variables de Colores y Estilos (Tema por defecto: Claro / Pergamino) */
        :root {
            --bg-color: #f4f1ea;
            --text-color: #2b2b2b;
            --header-bg: #0b3b24;
            --pf-gold: #c5a059;
            --card-bg: #fffcf5;
            --card-border: #d4c5b9;
            --tag-bg: #5a181b;
            --tag-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.15);
            --text-muted: #666666;
        }

        /* Tema Oscuro */
        [data-theme="dark"] {
            --bg-color: #121815;
            --text-color: #e0e0e0;
            --header-bg: #062214;
            --pf-gold: #d4af37;
            --card-bg: #1a231e;
            --card-border: #2d3b32;
            --tag-bg: #7a2226;
            --tag-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.5);
            --text-muted: #a6b2a9;
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cabecera Estilo Pathfinder */
        header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 15px 10px 15px;
            border-bottom: 2px solid var(--pf-gold);
            margin-bottom: 20px;
            background: var(--header-bg);
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .pf-main-logo {
            max-width: 440px;
            width: 85%;
            height: auto;
            display: block;
            clip-path: inset(18% 0% 18% 0%);
            margin: -25px auto -35px auto;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-variant: small-caps;
            color: #ffffff !important;
            letter-spacing: 2px;
            text-transform: lowercase;
            line-height: 0.9;
            margin-top: 0;
            margin-bottom: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.7);
        }

        /* Botón de Cambio de Tema (Modo Oscuro/Claro) */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--pf-gold);
            color: #fff;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        /* Controles, Buscador y Botonera de Bolsas */
        .controls {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            background-color: var(--card-bg);
            border: 2px solid var(--pf-gold);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1.1rem;
            font-family: 'Lora', serif;
            outline: none;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Botonera de Bolsas Dinámica */
        .bags-filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 900px;
        }

        .bag-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 4px var(--shadow);
        }

        .bag-btn:hover, .bag-btn.active {
            background-color: var(--pf-gold);
            color: #121815;
            border-color: var(--pf-gold);
        }

        /* Contador de resultados y mensajes de estado */
        .results-counter {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-style: italic;
            text-align: center;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--pf-gold);
            padding: 40px;
            font-family: 'Cinzel', serif;
        }

        /* Rejilla y Tarjetas de Peones */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 18px;
            box-shadow: 0 3px 8px var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 4px solid var(--pf-gold);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--shadow);
        }

        .card-title-es {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .card-title-en {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 6px;
        }

        .card-stats {
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
        }

        .stat-label {
            font-weight: 600;
            color: var(--pf-gold);
        }

        .tag-bolsa {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <!-- Cabecera -->
        <header>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
            <img src="./icons/PF2Logo.webp" alt="Pathfinder" class="pf-main-logo">
            <h1>Kingmaker Compendio</h1>
        </header>

        <!-- Controles de búsqueda y filtrado -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar peón por nombre en inglés o castellano..." oninput="applyFilters()">
            </div>
            <!-- Botonera generada dinámicamente para las bolsas -->
            <div class="bags-filter-container" id="bagsButtonsContainer"></div>
        </div>

        <div id="resultsCounter" class="results-counter"></div>
        
        <!-- Contenido principal -->
        <main id="main-content">
            <div id="loading">Consultando el arcón de peones de Google Sheets...</div>
            <div class="grid" id="peonesGrid"></div>
        </main>
    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo9ECEoZntqgSegnZg5pQm8hUd0_d0yxt4UujXkt-7cyQ1PYJSuRto43pXBM1StT8OrC4Pknt3PQUt/pub?output=csv";
        
        let allPeones = [];
        let currentSelectedBag = 'all';

        // Cargar los datos del Google Sheet al iniciar la página
        window.addEventListener('DOMContentLoaded', () => {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allPeones = results.data;
                    document.getElementById('loading').style.display = 'none';
                    generateBagButtons(allPeones);
                    renderPeones(allPeones);
                },
                error: function(err) {
                    document.getElementById('loading').textContent = "Error al conectar con el Google Sheet de peones.";
                    console.error(err);
                }
            });
        });

        // Detectar bolsas únicas de forma automática en el Google Sheet y crear la botonera
        function generateBagButtons(peones) {
            const container = document.getElementById('bagsButtonsContainer');
            const bagsSet = new Set();

            peones.forEach(p => {
                const bolsa = p['Bolsa'] ? p['Bolsa'].trim() : '';
                if (bolsa) bagsSet.add(bolsa);
            });

            const uniqueBags = Array.from(bagsSet).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));

            let html = `<button class="bag-btn active" data-bag="all" onclick="filterByBag('all')">Todas las Bolsas</button>`;
            uniqueBags.forEach(bag => {
                html += `<button class="bag-btn" data-bag="${bag}" onclick="filterByBag('${bag}')">${bag}</button>`;
            });

            container.innerHTML = html;
        }

        // Seleccionar bolsa desde la botonera
        function filterByBag(bagName) {
            currentSelectedBag = bagName;
            
            document.querySelectorAll('.bag-btn').forEach(btn => {
                if (btn.getAttribute('data-bag') === bagName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            applyFilters();
        }

        // Filtro combinado (Buscador de texto + Botonera de bolsa)
        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allPeones.filter(p => {
                const nameEn = (p['Name Pawn'] || '').toLowerCase();
                const nameEs = (p['Nombre Peón'] || '').toLowerCase();
                const bag = (p['Bolsa'] || '').trim();

                const matchesQuery = nameEn.includes(query) || nameEs.includes(query);
                const matchesBag = (currentSelectedBag === 'all') || (bag === currentSelectedBag);

                return matchesQuery && matchesBag;
            });

            renderPeones(filtered);
        }

        // Función para renderizar la lista de tarjetas
        function renderPeones(peones) {
            const grid = document.getElementById('peonesGrid');
            const counter = document.getElementById('resultsCounter');
            grid.innerHTML = '';

            counter.textContent = `Mostrando ${peones.length} peón/es`;

            if (peones.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; font-style: italic;">No se ha encontrado ningún peón con los filtros seleccionados.</p>`;
                return;
            }

            peones.forEach(p => {
                const keys = Object.keys(p);

                // Mapeo ajustado con la columna "Número Peón" y alternativa por posición de columna
                const nameEn = p['Name Pawn'] || p[keys[0]] || 'Desconocido';
                const pawnNum = p['Número Peón'] || p['Número'] || p['Nº Peón'] || p[keys[1]] || '-';
                const cantidad = p['PeónCantidad'] || p[keys[2]] || '1';
                const tamano = p['Tamaño'] || p[keys[3]] || '-';
                const nameEs = p['Nombre Peón'] || p[keys[4]] || 'Sin traducir';
                const bolsa = p['Bolsa'] || p[keys[5]] || 'Sin asignar';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-title-es">${nameEs}</div>
                    <div class="card-title-en">${nameEn}</div>
                    <div class="card-stats">
                        <div class="stat-row"><span class="stat-label">Nº de Peón:</span> <span>${pawnNum}</span></div>
                        <div class="stat-row"><span class="stat-label">Unidades:</span> <span>${cantidad}</span></div>
                        <div class="stat-row"><span class="stat-label">Tamaño:</span> <span>${tamano}</span></div>
                        <div class="stat-row" style="align-items: center; margin-top: 4px;"><span class="stat-label">Bolsa:</span> <span class="tag-bolsa">${bolsa}</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Lógica para alternar el Modo Oscuro / Claro y guardar la preferencia
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggleBtn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '☀️';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
