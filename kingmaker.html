<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingmaker — Compendio de Pathfinder 2e</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./icons/Pfav.png">

    <!-- Google Fonts: Cinzel para títulos y Lora para textos -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Librería PapaParse por si vas a leer datos de un CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        /* Variables de Colores y Estilos (Tema por defecto: Claro / Pergamino) */
        :root {
            --bg-color: #f4f1ea;
            --text-color: #2b2b2b;
            --header-bg: #0b3b24;
            --pf-gold: #c5a059;
            --card-bg: #fffcf5;
            --card-border: #d4c5b9;
            --tag-bg: #5a181b;
            --tag-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        /* Tema Oscuro */
        [data-theme="dark"] {
            --bg-color: #121815;
            --text-color: #e0e0e0;
            --header-bg: #062214;
            --pf-gold: #d4af37;
            --card-bg: #1a231e;
            --card-border: #2d3b32;
            --tag-bg: #7a2226;
            --tag-text: #ffffff;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cabecera Estilo Pathfinder */
        header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 15px 10px 15px;
            border-bottom: 2px solid var(--pf-gold);
            margin-bottom: 20px;
            background: var(--header-bg);
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .pf-main-logo {
            max-width: 440px;
            width: 85%;
            height: auto;
            display: block;
            clip-path: inset(18% 0% 18% 0%);
            margin: -25px auto -35px auto;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-variant: small-caps;
            color: #ffffff !important;
            letter-spacing: 2px;
            text-transform: lowercase;
            line-height: 0.9;
            margin-top: 0;
            margin-bottom: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.7);
        }

        /* Botón de Cambio de Tema (Modo Oscuro/Claro) */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--pf-gold);
            color: #fff;
            padding: 6px 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        /* Estilos generales para imágenes de acciones en texto */
        .pf-action-img {
            height: 1em;
            vertical-align: middle;
            margin: 0 2px;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <!-- Cabecera -->
        <header>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
            <img src="./icons/PF2Logo.webp" alt="Pathfinder" class="pf-main-logo">
            <h1>Kingmaker Compendio</h1>
        </header>

        <!-- Contenido principal (Aquí montaremos la lógica de peones y Google Sheets) -->
        <main id="main-content">
            <p style="text-align: center; font-style: italic;">Base estética de Kingmaker cargada correctamente. ¡Dime qué estructura o buscador necesitas que active!</p>
        </main>
    </div>

    <script>
        // Lógica para alternar el Modo Oscuro / Claro y guardar la preferencia
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggleBtn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.textContent = '☀️';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
