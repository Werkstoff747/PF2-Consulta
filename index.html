<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio Mágico PF2e - Google Sheets</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #701c26; }
        .contenedor-tabla {
            max-width: 95%;
            margin: 20px auto;
            overflow-x: auto;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #ddd;
        }
        th {
            background-color: #701c26;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h1>Compendio Mágico PF2e Remaster</h1>
    <p id="cargando">Cargando datos desde Google Sheets...</p>

    <div class="contenedor-tabla">
        <table id="tabla-datos" style="display:none;">
            <thead id="tabla-cabecera"></thead>
            <tbody id="tabla-cuerpo"></tbody>
        </table>
    </div>

    <script>
        // Enlace público directo a tu archivo CSV de Google Sheets
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTUNx-Tg6uDcxwffpf7XeKjlHJLhBm8i24Oq1ypRfX9j6JuEZnPGC3HbibEWWiQyNk2KVEJlG-HgtZU/pub?output=csv'; 

        // Función para procesar texto CSV respetando comillas
        function parseCSV(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                p = text[i - 1];
                if (c === '"') {
                    if (q && text[i + 1] === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && text[i + 1] === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') { r.push(row); }
            return r;
        }

        fetch(CSV_URL)
            .then(res => res.text())
            .then(csvText => {
                const filas = parseCSV(csvText);

                if (filas.length === 0) return;

                // 1. Cabecera (Primera fila del CSV)
                let cabeceraHTML = '<tr>';
                filas[0].forEach(col => {
                    cabeceraHTML += `<th>${col}</th>`;
                });
                cabeceraHTML += '</tr>';
                document.getElementById('tabla-cabecera').innerHTML = cabeceraHTML;

                // 2. Filas de Datos
                let cuerpoHTML = '';
                for (let i = 1; i < filas.length; i++) {
                    if (filas[i].length === 1 && filas[i][0] === '') continue; // Ignorar filas vacías
                    cuerpoHTML += '<tr>';
                    filas[i].forEach(celda => {
                        cuerpoHTML += `<td>${celda}</td>`;
                    });
                    cuerpoHTML += '</tr>';
                }
                document.getElementById('tabla-cuerpo').innerHTML = cuerpoHTML;

                // Mostrar tabla
                document.getElementById('cargando').style.display = 'none';
                document.getElementById('tabla-datos').style.display = 'table';
            })
            .catch(error => {
                console.error('Error al cargar el CSV:', error);
                document.getElementById('cargando').innerText = 'Error al cargar los datos desde Google Sheets.';
            });
    </script>

</body>
</html>
